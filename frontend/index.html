<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Game</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-min.css">
    <style>
        body {
            font-family: sans-serif;
        }
        #board {
            width: 400px;
        }
        #status {
            margin-top: 10px;
        }
        #role {
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Tempête sur l'échiquier</h1>
    <div id="board"></div>
    <div id="status"></div>
    <div id="role"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-min.js"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script>
        var board = null;
        var game = new Chess();
        var $status = $('#status');
        var $role = $('#role');
        var playerRole = null;
        var socket = io();

        function onDragStart(source, piece, position, orientation) {
            // do not pick up pieces if the game is over
            if (game.game_over()) return false;

            // only pick up pieces for the side to move
            if ((playerRole === 'w' && game.turn() === 'w' && piece.search(/^b/) === -1) ||
                (playerRole === 'b' && game.turn() === 'b' && piece.search(/^w/) === -1)) {
                return true;
            }

            return false;
        }

        function onDrop(source, target) {
            var move = {
                from: source,
                to: target,
                promotion: 'q' // NOTE: always promote to a queen for simplicity
            };

            // check if the move is legal locally for quick feedback
            var legalMove = game.move(move);
            if (legalMove === null) {
                return 'snapback';
            }
            game.undo(); // undo the move to wait for server confirmation

            socket.emit('move', move);
        }

        // update the board position after the piece snap
        // for castling, en passant, pawn promotion
        function onSnapEnd() {
            board.position(game.fen());
        }

        socket.on('playerRole', function(role) {
            playerRole = role;
            $role.html('You are playing as ' + (role === 'w' ? 'White' : 'Black'));
        });

        socket.on('spectatorRole', function() {
            $role.html('You are a spectator.');
        });

        socket.on('gameState', function(fen) {
            game.load(fen);
            board.position(fen);
        });

        socket.on('updateStatus', function(status) {
            $status.html(status);
        });

        socket.on('invalidMove', function() {
            // The server rejected the move, snap the piece back
            board.position(game.fen());
        });

        socket.on('notYourTurn', function() {
            // The server says it's not your turn
            // You can optionally show a message to the user
        });

        var config = {
            draggable: true,
            position: 'start',
            onDragStart: onDragStart,
            onDrop: onDrop,
            onSnapEnd: onSnapEnd
        };
        board = Chessboard('board', config);

    </script>
</body>
</html>
